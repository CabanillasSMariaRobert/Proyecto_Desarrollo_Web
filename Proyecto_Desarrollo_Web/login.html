<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | CALZA</title>
  </head>
  <body>
    <header>
      <h1>CALZA STORE</h1>
      <nav>
        <a href="index.html">Inicio</a> <a href="catalogo.html">Zapatillas</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Iniciar sesión</h2>
        <p>Ingresa a tu cuenta para continuar comprando.</p>

        <form action="#" method="post">
          <div>
            <label for="email">Correo electrónico</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="ejemplo@gmail.com"
              required
            />
          </div>

          <div>
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ingresa tu contraseña"
              required
            />
          </div>

          <div>
            <label>
              <input type="checkbox" name="recordar" /> Recordarme
            </label>

            <a href="recuperar-password.html"> ¿Olvidaste tu contraseña? </a>
          </div>
          <div><button type="submit">Iniciar sesión</button></div>
        </form>

        <div>
          <p>¿No tienes una cuenta?</p>
          <a href="registro.html"> Crear una cuenta </a>
        </div>
      </section>
    </main>

    <footer><p>© 2026 CALZA. Todos los derechos reservados.</p></footer>
  </body>
</html>
