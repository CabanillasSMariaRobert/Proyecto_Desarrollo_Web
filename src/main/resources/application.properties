spring.application.name=tienda-kalza

# --- Conexión H2 (Persistente en disco) ---
spring.datasource.url=jdbc:h2:file:./data/midb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=codigochiquitin.

# --- Configuración JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Consola Web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT Configuration ---
jwt.secret=${JWT_SECRET:clave-secreta-muy-larga-para-firmar-tokens-jwt-segura-256-bits-minimo-32-chars}
jwt.expiration=86400000
# Desarrollo local: volver a leer las plantillas al navegar.
spring.thymeleaf.cache=false
