<!DOCTYPE html>
<html lang="es" th:replace="~{fragments/general/layout :: layout(~{::content})}">
<body>

<div th:fragment="content">
    <!-- ============ HEADER ============ -->
    <!-- ============ CONTENIDO ============ -->
        <div class="container">
            <h1 class="fs-2 fw-bold mb-4">Tu carrito</h1>

            <div class="row g-4 g-lg-5">
                <!-- ITEMS DEL CARRITO -->
                <div class="col-lg-8">
                    <div class="d-flex flex-column gap-3">
                        <div class="card border rounded-3 p-3">
                            <div class="row g-3 align-items-center">
                                <div class="col-4 col-sm-3 col-md-2">
                                    <div class="rounded-3 overflow-hidden"
                                        style="aspect-ratio:1/1; background:#f5f5f5;">
                                        <img th:src="@{/img/productos/AeroGlide Pro Runner.webp}"
                                            class="w-100 h-100 object-fit-cover" alt="AeroGlide Pro Runner">
                                    </div>
                                </div>
                                <div class="col-8 col-sm-9 col-md-10">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div>
                                            <h3 class="h6 fw-bold mb-1">AeroGlide Pro Runner</h3>
                                            <p class="small text-muted mb-2">Talla: 10.5 | Color: Negro Obsidiana</p>
                                        </div>
                                        <span class="fw-bold">S/ 145.00</span>
                                    </div>
                                    <div class="d-flex align-items-center gap-3 mt-2">
                                        <div class="input-group input-group-sm" style="width: 130px;">
                                            <button class="btn btn-outline-secondary" type="button">-</button>
                                            <span class="input-group-text fw-bold">1</span>
                                            <button class="btn btn-outline-secondary" type="button">+</button>
                                        </div>
                                        <button class="btn btn-link text-danger p-0 small">
                                            <i class="bi bi-trash me-1"></i>Eliminar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card border rounded-3 p-3">
                            <div class="row g-3 align-items-center">
                                <div class="col-4 col-sm-3 col-md-2">
                                    <div class="rounded-3 overflow-hidden"
                                        style="aspect-ratio:1/1; background:#f5f5f5;">
                                        <img th:src="@{/img/productos/Court Classic Low.webp}"
                                            class="w-100 h-100 object-fit-cover" alt="Court Classic Low">
                                    </div>
                                </div>
                                <div class="col-8 col-sm-9 col-md-10">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div>
                                            <h3 class="h6 fw-bold mb-1">Court Classic Low</h3>
                                            <p class="small text-muted mb-2">Talla: 9 | Color: Blanco Nube</p>
                                        </div>
                                        <span class="fw-bold">S/ 95.00</span>
                                    </div>
                                    <div class="d-flex align-items-center gap-3 mt-2">
                                        <div class="input-group input-group-sm" style="width: 130px;">
                                            <button class="btn btn-outline-secondary" type="button">-</button>
                                            <span class="input-group-text fw-bold">2</span>
                                            <button class="btn btn-outline-secondary" type="button">+</button>
                                        </div>
                                        <button class="btn btn-link text-danger p-0 small">
                                            <i class="bi bi-trash me-1"></i>Eliminar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- RESUMEN DEL PEDIDO -->
                <div class="col-lg-4">
                    <div class="card border rounded-3 p-4">
                        <h2 class="h5 fw-bold border-bottom pb-2 mb-3">Resumen del pedido</h2>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal (3 items)</span>
                            <span class="fw-semibold">S/ 335.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Envío</span>
                            <span class="fw-semibold">Calculado en el pago</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">IGV</span>
                            <span class="fw-semibold">S/ 60.30</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-end border-top pt-3 mb-4">
                            <span class="fw-bold">Total</span>
                            <span class="fs-4 fw-bold">S/ 395.30</span>
                        </div>
                        <a th:href="@{/checkout}" class="btn btn-blue w-100 py-2">
                            Procesar pago
                        </a>
                    </div>
                </div>
            </div>
        </div>
    <!-- ============ FOOTER ============ -->
</div>

</body>
</html>
