<!DOCTYPE html>
<html lang="es" th:replace="~{fragments/general/layout :: layout(~{::content})}">
<body>

<div th:fragment="content">
    <div class="container py-4">
        <h1 class="fs-2 fw-bold mb-4">Tu carrito</h1>

        <!-- MENSAJES DE ALERTA -->
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
            <span th:text="${mensaje}">Operación exitosa</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
            <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <div class="row g-4 g-lg-5">
            <!-- ITEMS DEL CARRITO Y METODOS DE PAGO -->
            <div class="col-lg-8">
                <!-- ITEMS -->
                <div class="d-flex flex-column gap-3 mb-4">
                    <div class="card border rounded-3 p-3" th:each="item : ${items}">
                        <div class="row g-3 align-items-center">
                            <div class="col-4 col-sm-3 col-md-2">
                                <div class="rounded-3 overflow-hidden" style="aspect-ratio:1/1; background:#f5f5f5;">
                                    <img th:src="@{'/img/productos/' + ${item.imagen}}"
                                         class="w-100 h-100 object-fit-cover" th:alt="${item.nombre}">
                                </div>
                            </div>
                            <div class="col-8 col-sm-9 col-md-10">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <h3 class="h6 fw-bold mb-1" th:text="${item.nombre}"></h3>
                                        <!-- Línea corregida sin colisión de barras de Thymeleaf -->
                                        <p class="small text-muted mb-2"
                                           th:text="|Talla: ${item.talla}| + ' | Color: ' + ${item.color}"></p>
                                    </div>
                                    <span class="fw-bold" th:text="|S/ ${item.precioUnitario}|"></span>
                                </div>
                                <div class="d-flex align-items-center gap-3 mt-2">
                                    <div class="input-group input-group-sm" style="width: 130px;">
                                        <button class="btn btn-outline-secondary" type="button">-</button>
                                        <span class="input-group-text fw-bold" th:text="${item.cantidad}">1</span>
                                        <button class="btn btn-outline-secondary" type="button">+</button>
                                    </div>
                                    <button class="btn btn-link text-danger p-0 small">
                                        <i class="bi bi-trash me-1"></i>Eliminar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- METODOS DE PAGO -->
                <div class="card border rounded-3 p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 fw-bold mb-0">
                            <i class="bi bi-credit-card me-2"></i>Métodos de pago
                        </h2>
                        <button class="btn btn-sm btn-dark" data-bs-toggle="modal" data-bs-target="#modalAgregarTarjeta">
                            <i class="bi bi-plus-lg me-1"></i>Agregar tarjeta
                        </button>
                    </div>

                    <div th:if="${#lists.isEmpty(metodosPago)}" class="text-muted small py-2">
                        No tienes tarjetas guardadas. Agrega una para procesar tu compra rápidamente.
                    </div>

                    <div th:each="metodo, iter : ${metodosPago}"
                         class="border rounded-3 p-3 mb-2 d-flex justify-content-between align-items-center">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="idMetodoPagoSeleccionado"
                                   th:id="'tarjeta-' + ${metodo.idMetodoDePago}"
                                   th:value="${metodo.idMetodoDePago}"
                                   th:checked="${iter.first}">
                            <label class="form-check-label ms-2" th:for="'tarjeta-' + ${metodo.idMetodoDePago}">
                                <strong class="text-uppercase" th:text="${metodo.redUsada}">VISA</strong>
                                <span class="text-muted" th:text="|•••• ${metodo.ultimos4Digitos}|">•••• 1234</span>
                                <small class="text-muted d-block"
                                       th:text="|Vence: ${metodo.expiraElMes}/${metodo.expiraElAnio} (${metodo.pasarela})|"></small>
                            </label>
                        </div>
                        <form th:action="@{/carrito/metodo-pago/{id}/eliminar(id=${metodo.idMetodoDePago})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('¿Seguro que deseas eliminar esta tarjeta?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar tarjeta">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- RESUMEN DEL PEDIDO -->
            <div class="col-lg-4">
                <div class="card border rounded-3 p-4">
                    <h2 class="h5 fw-bold border-bottom pb-2 mb-3">Resumen del pedido</h2>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted" th:text="|Subtotal (${resumen.totalItems} items)|">Subtotal</span>
                        <span class="fw-semibold" th:text="|S/ ${resumen.subtotal}|">S/ 0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Envío</span>
                        <span class="fw-semibold" th:text="${resumen.envioTexto}">Gratis</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">IGV</span>
                        <span class="fw-semibold" th:text="|S/ ${resumen.igv}|">S/ 0.00</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-end border-top pt-3 mb-4">
                        <span class="fw-bold">Total</span>
                        <span class="fs-4 fw-bold" th:text="|S/ ${resumen.total}|">S/ 0.00</span>
                    </div>
                    <a th:href="@{/checkout}" class="btn btn-blue w-100 py-2">
                        Procesar pago
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL AGREGAR TARJETA -->
    <div class="modal fade" id="modalAgregarTarjeta" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title fs-5 fw-bold">Agregar método de pago</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <form th:action="@{/carrito/metodo-pago/guardar}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Red de tarjeta</label>
                            <select class="form-select" name="redUsada" required>
                                <option th:each="red : ${redes}" th:value="${red}" th:text="${red}">VISA</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Número de tarjeta</label>
                            <input type="text" class="form-control" name="numeroTarjeta"
                                   placeholder="•••• •••• •••• 1234" maxlength="19" required>
                        </div>
                        <!-- FILA CON VENCIMIENTO Y CVV UNIFICADOS -->
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Vencimiento</label>
                                <input type="text" class="form-control" name="fechaVencimiento"
                                       placeholder="MM/AA (ej: 12/28)" maxlength="5" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">CVV</label>
                                <input type="password" class="form-control" name="cvv"
                                       placeholder="123" maxlength="4" required>
                            </div>
                        </div>
                        <div class="mb-0">
                            <label class="form-label fw-semibold">Pasarela de pago</label>
                            <input type="text" class="form-control" name="pasarela"
                                   placeholder="Ej: Culqi, MercadoPago" value="Pasarela Web">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-dark">Guardar tarjeta</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
