<!DOCTYPE html>
<html lang="es" th:replace="~{fragments/general/layout :: layout(~{::content})}">
<body>

<div th:fragment="content">
    <!-- ============ HEADER ============ -->
    <!-- ============ CONTENIDO ============ -->
        <div class="container">
            <div class="border-bottom pb-3 mb-4">
                <div>
                    <h1 class="fs-2 fw-bold mb-1">Historial de pedidos</h1>
                    <p class="text-muted mb-0">Consulta y administra tus compras recientes.</p>
                </div>
            </div>

            <div class="row g-4">
                <!-- MENÚ LATERAL -->
                <aside class="col-md-3 col-lg-2">
                    <nav class="nav flex-column gap-1">
                        <h3 class="h6 fw-bold mb-2">Mi cuenta</h3>
                        <a th:href="@{/perfil}" class="nav-link text-muted">
                            <i class="bi bi-person me-2"></i>Perfil
                        </a>
                        <a th:href="@{/pedidos}" class="nav-link fw-semibold active bg-light border-start border-2 border-dark">
                            <i class="bi bi-box-seam me-2"></i>Historial de pedidos
                        </a>
                        <a th:href="@{/login}" class="nav-link text-muted mt-3">
                            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                        </a>
                    </nav>
                </aside>

                <section class="col-md-9 col-lg-10">
                    <div class="card border-0 shadow-sm overflow-hidden">
                        <div class="d-none d-md-grid grid-5 p-3 fw-bold border-bottom" style="grid-template-columns: 1fr 1fr 2fr 1fr 1fr;">
                            <div>Pedido</div>
                            <div>Fecha</div>
                            <div>Productos</div>
                            <div>Estado</div>
                            <div class="text-end">Total</div>
                        </div>

                        <!-- Pedido -->
                        <div class="p-3 border-bottom hover-bg" th:each="pedido : ${pedidos}">
                            <div class="row g-3 align-items-center">
                                <div class="col-12 col-md-2 fw-bold" th:text="${pedido.codigo}">#ORD-99382</div>
                                <div class="col-6 col-md-2 text-muted" th:text="${pedido.fecha}">24/10/2024</div>
                                <div class="col-12 col-md-4 d-flex align-items-center gap-3">
                                    <img th:src="${pedido.imagen}" alt="Producto" width="48" height="48"
                                        class="rounded-3 object-fit-cover">
                                    <span th:text="${pedido.resumenProductos}">Velocity Pro X + 1 más</span>
                                </div>
                                <div class="col-6 col-md-2">
                                    <span th:class="'badge ' + ${pedido.claseEstado} + ' text-uppercase'" th:text="${pedido.estado}">Entregado</span>
                                </div>
                                <div class="col-12 col-md-2 d-flex justify-content-between align-items-center md:justify-end">
                                    <span class="fw-bold" th:text="${pedido.total}">S/ 640.00</span>
                                    <a th:href="${pedido.accion}" class="btn btn-sm btn-outline-dark" th:text="${pedido.textoAccion}">Detalles</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    <!-- ============ FOOTER ============ -->
</div>

</body>
</html>
