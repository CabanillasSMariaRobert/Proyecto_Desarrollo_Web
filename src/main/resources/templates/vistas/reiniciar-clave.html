<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/general/layout :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card border rounded-4 shadow-sm p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock fs-1 text-primary" aria-hidden="true"></i>
                        <h1 class="fs-2 fw-bold mt-2 mb-1">Reinicia tu contraseña</h1>
                        <p class="text-muted mb-0" th:if="${tokenValido}">Elige una nueva contraseña para volver a ingresar a tu cuenta.</p>
                        <p class="text-muted mb-0" th:unless="${tokenValido}">Accede desde el enlace de recuperación enviado a tu correo.</p>
                    </div>

                    <div th:if="${errorGlobal}" class="alert alert-danger" role="alert" th:text="${errorGlobal}"></div>

                    <form th:if="${tokenValido}" th:action="@{/reiniciar-clave}" th:object="${reiniciarClaveForm}" method="post" novalidate>
                        <input type="hidden" th:field="*{token}">
                        <div class="mb-3">
                            <label for="clave" class="form-label fw-semibold">Nueva contraseña</label>
                            <input type="password" id="clave" th:field="*{clave}" class="form-control"
                                   th:classappend="${#fields.hasErrors('clave')} ? 'is-invalid' : ''"
                                   placeholder="Ingresa tu nueva contraseña" autocomplete="new-password"
                                   minlength="6" maxlength="72" aria-describedby="clave-ayuda clave-error" required>
                            <div id="clave-ayuda" class="form-text">Usa al menos 6 caracteres.</div>
                            <div id="clave-error" th:if="${#fields.hasErrors('clave')}" class="invalid-feedback d-block" th:errors="*{clave}"></div>
                        </div>
                        <div class="mb-4">
                            <label for="confirmarClave" class="form-label fw-semibold">Confirmar nueva contraseña</label>
                            <input type="password" id="confirmarClave" th:field="*{confirmarClave}" class="form-control"
                                   th:classappend="${#fields.hasErrors('confirmarClave')} ? 'is-invalid' : ''"
                                   placeholder="Vuelve a escribir tu contraseña" autocomplete="new-password"
                                   minlength="6" maxlength="72" aria-describedby="confirmar-error" required>
                            <div id="confirmar-error" th:if="${#fields.hasErrors('confirmarClave')}" class="invalid-feedback d-block" th:errors="*{confirmarClave}"></div>
                        </div>
                        <button type="submit" class="btn btn-blue w-100 py-2">Guardar nueva contraseña</button>
                    </form>

                    <a th:unless="${tokenValido}" th:href="@{/olvide-mi-clave}" class="btn btn-blue w-100 py-2">Solicitar un nuevo enlace</a>
                    <div class="text-center mt-4"><a th:href="@{/login}" class="fw-semibold">Volver a iniciar sesión</a></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
