<!DOCTYPE html>
<html lang="es" th:replace="~{fragments/general/layout :: layout(~{::content})}">
<body>

<div th:fragment="content">
    <!-- ============ HEADER ============ -->
    <!-- ============ CONTENIDO (Bootstrap) ============ -->
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <div class="card border rounded-4 shadow-sm p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h1 class="fs-2 fw-bold mb-1">Crea tu cuenta</h1>
                            <p class="text-muted mb-0">Únete a KALZA hoy mismo.</p>
                        </div>

                        <div th:if="${errorGlobal}" class="alert alert-danger" role="alert"
                             th:text="${errorGlobal}"></div>

                        <form th:action="@{/registro}" th:object="${registroForm}" method="post" novalidate>
                            <div class="mb-3">
                                <label for="nombreCompleto" class="form-label fw-semibold">Nombre completo</label>
                                <input type="text" id="nombreCompleto" th:field="*{nombreCompleto}"
                                    class="form-control" th:classappend="${#fields.hasErrors('nombreCompleto')} ? 'is-invalid' : ''"
                                    placeholder="John Doe" required>
                                <div th:if="${#fields.hasErrors('nombreCompleto')}" class="invalid-feedback d-block"
                                    th:errors="*{nombreCompleto}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label fw-semibold">Correo electrónico</label>
                                <input type="email" id="correo" th:field="*{correo}"
                                    class="form-control" th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid' : ''"
                                    placeholder="ejemplo@gmail.com" required>
                                <div th:if="${#fields.hasErrors('correo')}" class="invalid-feedback d-block"
                                    th:errors="*{correo}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="clave" class="form-label fw-semibold">Contraseña</label>
                                <input type="password" id="clave" th:field="*{clave}"
                                    class="form-control" th:classappend="${#fields.hasErrors('clave')} ? 'is-invalid' : ''"
                                    placeholder="••••••••" required>
                                <div th:if="${#fields.hasErrors('clave')}" class="invalid-feedback d-block"
                                    th:errors="*{clave}"></div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmarClave" class="form-label fw-semibold">Confirmar contraseña</label>
                                <input type="password" id="confirmarClave" th:field="*{confirmarClave}"
                                    class="form-control" th:classappend="${#fields.hasErrors('confirmarClave')} ? 'is-invalid' : ''"
                                    placeholder="••••••••" required>
                                <div th:if="${#fields.hasErrors('confirmarClave')}" class="invalid-feedback d-block"
                                    th:errors="*{confirmarClave}"></div>
                            </div>

                            <button type="submit" class="btn btn-blue w-100 py-2">Crear cuenta</button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="text-muted mb-0">
                                ¿Ya tienes una cuenta?
                                <a th:href="@{/login}" class="fw-semibold">Inicia sesión</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    <!-- ============ FOOTER ============ -->
</div>

</body>
</html>
