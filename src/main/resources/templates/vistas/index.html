<!DOCTYPE html>
<html lang="es" th:replace="~{fragments/general/layout :: layout(~{::content})}">
<body>

<div th:fragment="content">
    <!-- HEADER -->
    <!-- CONTENIDOS  -->
      <section class="py-5">
        <div class="container">
          <div class="row align-items-center g-4 g-lg-5">
            <div class="col-lg-6">
              <h1
                class="display-4 fw-bolder lh-sm"
                style="letter-spacing: -0.02em"
                th:text="${hero.titular}"
              ></h1>
              <p
                class="fs-5 text-muted my-4"
                style="max-width: 480px"
                th:text="${hero.bajada}"
              ></p>
              <a th:href="@{/catalogo}" class="btn btn-blue btn-lg px-4 py-2">
                Comprar ahora
              </a>
            </div>
            <div class="col-lg-6">
              <div
                class="overflow-hidden rounded-3 shadow-sm card-hover"
                style="aspect-ratio: 1/1; background: #f5f5f5"
              >
                <img
                  th:src="@{'/img/productos/' + ${hero.imagen}}"
                  alt="Nueva colección de zapatillas"
                  class="w-100 h-100 object-fit-cover"
                />
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- CATEGORÍAS -->
      <section class="py-5 border-top">
        <div class="container">
          <h2 class="kalza-section-title mb-4">Explora nuestras categorías</h2>
          <div class="row g-4">
            <div class="col-6 col-md-3" th:each="categoria : ${categorias}">
              <div class="card border-0 shadow-sm h-100 text-center card-hover">
                <div
                  class="overflow-hidden"
                  style="aspect-ratio: 1/1; background: #f5f5f5"
                >
                  <img
                    th:src="@{'/img/productos/' + ${categoria.imagen}}"
                    class="w-100 h-100 object-fit-cover"
                    th:alt="${categoria.alt}"
                  />
                </div>
                <div class="card-body">
                  <h3 class="h6 fw-bold" th:text="${categoria.nombre}"></h3>
                  <a th:href="${categoria.enlace}" class="small"
                    >Ver colección</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- PRODUCTOS DESTACADOS -->
      <section class="py-5 border-top">
        <div class="container">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
              <h2 class="kalza-section-title mb-0">Productos destacados</h2>
              <p class="text-muted mb-0 mt-1">
                Los favoritos de nuestros clientes
              </p>
            </div>
            <a th:href="@{/catalogo}" class="fw-semibold small">
              Ver todas
            </a>
          </div>

          <div class="row g-4">
            <div class="col-6 col-lg-3" th:each="destacado : ${destacados}">
              <div class="card border-0 shadow-sm h-100 card-hover">
                <div
                  class="position-relative overflow-hidden"
                  style="aspect-ratio: 4/5; background: #f5f5f5"
                >
                  <a th:href="@{/producto}">
                    <img
                      th:src="@{'/img/productos/' + ${destacado.imagen}}"
                      class="w-100 h-100 object-fit-cover"
                      th:alt="${destacado.alt}"
                    />
                  </a>
                  <span
                    th:if="${destacado.nuevo}"
                    class="badge bg-dark position-absolute top-0 start-0 m-2 text-uppercase"
                    >Nuevo</span
                  >
                </div>
                <div class="card-body">
                  <p class="text-muted small mb-1" th:text="${destacado.marca}"></p>
                  <a
                    th:href="@{/producto}"
                    class="text-decoration-none text-dark"
                  >
                    <h3 class="h6 fw-bold" th:text="${destacado.nombre}"></h3>
                  </a>
                  <p
                    class="fw-bold mb-2"
                    th:text="|S/ ${destacado.precio}|"
                  ></p>
                  <a
                    th:href="@{/producto}"
                    class="btn btn-sm btn-outline-dark w-100"
                    >Ver producto</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- OFERTA ESPECIAL -->
      <section class="py-5 border-top">
        <div class="container">
          <div class="row align-items-center g-4">
            <div class="col-lg-7">
              <p
                class="text-uppercase fw-semibold text-muted small mb-2"
                th:text="${oferta.eyebrow}"
              ></p>
              <h2
                class="display-6 fw-bold mb-3"
                th:text="${oferta.titular}"
              ></h2>
              <p
                class="text-muted mb-4"
                style="max-width: 480px"
                th:text="${oferta.descripcion}"
              ></p>
              <a th:href="@{/publicidad}" class="btn btn-blue btn-lg px-4 py-2"
                >Ver promociones</a
              >
            </div>
            <div class="col-lg-5">
              <div
                class="overflow-hidden rounded-3 shadow-sm"
                style="aspect-ratio: 1/1; background: #f5f5f5"
              >
                <img
                  th:src="@{'/img/productos/' + ${oferta.imagen}}"
                  alt="Promoción de zapatillas"
                  class="w-100 h-100 object-fit-cover"
                />
              </div>
            </div>
          </div>
        </div>
      </section>
    <!-- ============ FOOTER  ============ -->
</div>

</body>
</html>
