<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/general/layout :: layout(~{::content})}">
<body><div th:fragment="content" class="container py-4 d-flex flex-column gap-4">
<a th:href="@{/catalogo}">Volver al catálogo</a><div th:if="${mensaje}" class="alert alert-success" role="status" th:text="${mensaje}"></div>
<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
<div class="row g-4"><div class="col-md-6"><img th:if="${producto.imagen != null}" th:src="${producto.imagen}" th:alt="${producto.nombre}" class="img-fluid" style="max-height:480px;object-fit:contain"></div>
<div class="col-md-6"><p th:text="${producto.marca}" class="text-muted"></p><h1 th:text="${producto.nombre}"></h1><p class="fs-3 fw-bold" th:text="|S/ ${producto.precio}|"></p><p th:text="${producto.descripcion}"></p>
<h2 class="h5">Materiales</h2><ul><li th:each="m : ${producto.materiales}" th:text="${m}"></li></ul><p th:if="${#lists.isEmpty(producto.materiales)}" class="text-muted">Composición no especificada.</p>
<form th:action="@{/carrito/agregar}" method="post" class="d-flex flex-column gap-3">
<label for="variante">Talla europea y color</label><select id="variante" name="idVariante" class="form-select" required><option value="">Selecciona una combinación</option><option th:each="v : ${producto.variantes}" th:value="${v.idVariante}" th:disabled="${v.stock == 0}" th:text="|Talla ${v.talla} · ${v.color} · ${v.stock} pares disponibles|"></option></select>
<p th:if="${#lists.isEmpty(producto.variantes)}" class="text-muted">No hay variantes activas.</p>
<label for="cantidad">Cantidad de pares</label><input id="cantidad" type="number" name="cantidad" min="1" value="1" class="form-control" required>
<button class="btn btn-dark" th:disabled="${#lists.isEmpty(producto.variantes)}">Agregar al carrito</button><small class="text-muted">La disponibilidad se comprueba al agregar al carrito; no se reservan existencias.</small></form></div></div>
</div></body></html>
