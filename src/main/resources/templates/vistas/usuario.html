<!DOCTYPE html>
<html lang="es" th:replace="~{fragments/general/layout :: layout(~{::content})}">
<body>

<div th:fragment="content">
    <!-- HEADER  -->
    <!--  CONTENIDO  -->
      <div class="container">
        <!-- RESÚMENES DEL USUARIO -->
        <section class="mb-5">
          <h1 class="fs-2 fw-bold mb-4" th:text="|Hola, ${saludo}|"></h1>
          <div class="row g-4">
            <div class="col-md-4" th:each="resumen : ${resumenes}">
              <div class="card border-0 shadow-sm p-4 text-center">
                <i class="bi fs-1" th:class="'bi ' + ${resumen.icono}"></i>
                <h2 class="h5 fw-bold mt-3 mb-1" th:text="${resumen.titulo}"></h2>
                <p class="text-muted mb-2" th:text="${resumen.detalle}"></p>
                <a th:href="${resumen.enlace}" class="small fw-semibold" th:text="${resumen.textoEnlace}"></a>
              </div>
            </div>
          </div>
        </section>

        <!-- ACCESOS RÁPIDOS -->
        <section>
          <h2 class="h5 fw-bold mb-4">Accesos rápidos</h2>
          <div class="row g-3">
            <div class="col-6 col-md-3" th:each="acceso : ${accesos}">
              <a
                th:href="${acceso.enlace}"
                class="card border-0 shadow-sm p-4 h-100 text-center text-decoration-none card-hover"
              >
                <i class="bi fs-2" th:class="'bi ' + ${acceso.icono}"></i>
                <span class="fw-semibold mt-2 d-block" th:text="${acceso.titulo}"></span>
              </a>
            </div>
          </div>
        </section>
      </div>
    <!-- ============ FOOTER ============ -->
</div>

</body>
</html>
