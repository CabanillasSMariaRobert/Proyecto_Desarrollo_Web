<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALZA | Catálogo</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container d-flex justify-content-between align-items-center py-3">
            <a th:href="@{/}" class="brand">KAL<span class="accent">ZA</span></a>
            <nav class="main-nav">
                <a th:href="@{/}">Inicio</a>
                <a th:href="@{/catalogo}" class="active">Zapatillas</a>
            </nav>
            <div class="header-actions">
                <a th:href="@{/login}" class="btn btn-outline-primary">Iniciar sesión</a>
            </div>
        </div>
    </header>

    <main class="py-5">
        <div class="container">
            <h1 class="mb-4">Catálogo de Zapatillas</h1>
            <div class="row g-4" id="productos-grid">
                <div class="col-12 text-center py-5 text-muted">
                    <i class="bi bi-box-seam display-1"></i>
                    <p class="mt-3">Catálogo en desarrollo. Próximamente productos aquí.</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer py-4 text-center text-muted">
        &copy; 2026 KALZA. Todos los derechos reservados.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
