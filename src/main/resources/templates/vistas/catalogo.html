<!DOCTYPE html>
<html lang="es" th:replace="~{fragments/general/layout :: layout(~{::content})}">
<body>

<div th:fragment="content">
    <!-- HEADER -->
    <!-- CONTENIDO-->
      <div class="container">
        <div class="row g-4 g-lg-5">
          <!-- filto de busqueda -->
          <aside class="col-lg-3">
            <h3
              class="text-uppercase fw-semibold small border-bottom pb-2 mb-3"
            >
              CategorÃ­as
            </h3>
            <div class="form-check mb-2" th:each="cat : ${categorias}">
              <input class="form-check-input" type="checkbox" th:id="${cat.id}" th:checked="${cat.seleccionada}" />
              <label class="form-check-label" th:for="${cat.id}" th:text="${cat.nombre}">Categoria</label>
            </div>

            <h3
              class="text-uppercase fw-semibold small border-bottom pb-2 my-4"
            >
              Talla
            </h3>
            <div class="d-flex flex-wrap gap-2">
              <button class="btn btn-sm size-btn" th:each="talla : ${tallas}" th:classappend="${!talla.habilitada ? 'btn-outline-secondary disabled' : (talla.seleccionada ? 'btn-dark' : 'btn-outline-dark')}" th:text="${talla.etiqueta}">8</button>
            </div>

            <h3
              class="text-uppercase fw-semibold small border-bottom pb-2 my-4"
            >
              Precio
            </h3>
            <input type="range" class="form-range w-100" th:min="${rangoPrecio.minimo}" th:max="${rangoPrecio.maximo}" />
            <div class="d-flex justify-content-between small text-muted">
              <span th:text="|S/ ${rangoPrecio.minimo}|">S/ 0</span>
              <span th:text="|S/ ${rangoPrecio.maximo}+|">S/ 300+</span>
            </div>

            <button class="btn btn-outline-dark w-100 mt-4">
              Limpiar filtros
            </button>
          </aside>

          <!-- Listado de los productos -->
          <div class="col-lg-9">
            <div
              class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4"
            >
              <h1 class="fs-3 fw-bold mb-0">
                Zapatillas
                <span class="fs-6 text-muted fw-normal">(124 productos)</span>
              </h1>
              <div class="d-flex align-items-center gap-2">
                <span class="small text-muted text-uppercase"
                  >Ordenar por:</span
                >
                <select class="form-select form-select-sm w-auto fw-semibold">
                  <option th:each="ord : ${ordenamientos}" th:selected="${ord.seleccionado}" th:text="${ord.etiqueta}">Novedades</option>
                </select>
              </div>
            </div>

            <div class="row g-4">
              <div class="col-6 col-md-4" th:each="producto : ${productos}">
                <div class="card border-0 shadow-sm h-100 card-hover" th:classappend="${!producto.enStock} ? 'opacity-50' : ''">
                  <div class="position-relative overflow-hidden" style="aspect-ratio: 4/5; background: #f5f5f5">
                    <a th:href="@{|/producto/${producto.id}|}">
                      <img th:src="@{|/img/productos/${producto.imagen}|}" class="w-100 h-100 object-fit-cover" th:classappend="${!producto.enStock} ? 'grayscale' : ''" th:alt="${producto.nombre}" />
                    </a>
                    <span th:if="${producto.nuevo}" class="badge bg-dark position-absolute top-0 start-0 m-2 text-uppercase">Nuevo</span>
                    <span th:if="${!producto.enStock}" class="position-absolute top-50 start-50 translate-middle bg-white text-dark text-uppercase fw-semibold small border border-dark px-2 py-1">Agotado</span>
                  </div>
                  <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                      <a th:href="@{|/producto/${producto.id}|}" class="text-decoration-none text-dark" th:classappend="${!producto.enStock} ? 'text-muted' : ''">
                        <h2 class="h6 fw-bold mb-0" th:text="${producto.nombre}">Nombre</h2>
                      </a>
                      <div class="text-end" th:if="${producto.precioAnterior != null}">
                        <span class="fw-bold d-block" style="color: var(--kalza-blue)" th:text="|S/ ${producto.precio}|">S/ 120</span>
                        <span class="text-decoration-line-through text-muted small" th:text="|S/ ${producto.precioAnterior}|">S/ 150</span>
                      </div>
                      <span class="fw-bold" th:if="${producto.precioAnterior == null}" th:classappend="${!producto.enStock} ? 'text-muted' : ''" th:text="|S/ ${producto.precio}|">S/ 180</span>
                    </div>
                    <p class="small text-muted mb-3" th:text="${producto.descripcion}">Descripcion</p>
                    <div class="d-flex justify-content-between align-items-center small">
                      <span th:if="${producto.enStock}" class="fw-semibold" style="color: var(--kalza-blue)">
                        <i class="bi bi-circle-fill me-1" style="font-size: 0.6rem"></i>En stock
                      </span>
                      <span th:if="${!producto.enStock}" class="text-muted">
                        <i class="bi bi-circle me-1" style="font-size: 0.6rem"></i>Agotado
                      </span>
                      <span class="text-muted" th:text="${producto.enStock ? 'Tallas: ' + producto.tallas : '-'}">Tallas</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- PAGINACIÃ“N -->
            <nav
              class="d-flex justify-content-center mt-5"
              aria-label="PaginaciÃ³n"
            >
              <ul class="pagination">
                <li class="page-item" th:each="pag, iterStat : ${paginacion}" th:classappend="${!pag.habilitada ? 'disabled' : (pag.activa ? 'active' : '')}">
                  <a class="page-link" href="#" th:if="${!pag.esSeparador and pag.etiqueta != ''}" th:text="${pag.etiqueta}">1</a>
                  <a class="page-link" href="#" th:if="${pag.esSeparador}">...</a>
                  <a class="page-link" href="#" th:if="${!pag.esSeparador and pag.etiqueta == ''}" th:aria-label="${iterStat.first ? 'Anterior' : 'Siguiente'}">
                    <i th:class="${iterStat.first ? 'bi bi-chevron-left' : 'bi bi-chevron-right'}"></i>
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    <!--FOOTER -->
    <!-- Filtro de talla  -->
    <script>
      document.querySelectorAll(".size-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (this.classList.contains("disabled")) return;
          this.classList.toggle("btn-dark");
          this.classList.toggle("btn-outline-dark");
        });
      });
    </script>
</div>

</body>
</html>
