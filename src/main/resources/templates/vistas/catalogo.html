<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/general/layout :: layout(~{::content})}">
<body><div th:fragment="content" class="container py-4 d-flex flex-column gap-4">
<h1>Catálogo de calzado</h1><div th:if="${mensaje}" class="alert alert-success" role="status" th:text="${mensaje}"></div>
<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
<form method="get" th:action="@{/catalogo}" class="d-flex gap-2"><label for="buscar" class="visually-hidden">Buscar por nombre</label><input id="buscar" name="buscar" th:value="${buscar}" class="form-control" placeholder="Buscar por nombre"><button class="btn btn-dark">Buscar</button></form>
<div th:if="${page.empty}" class="alert alert-info">No hay calzados disponibles para esta búsqueda.</div>
<div class="row g-4"><div th:each="p : ${page.content}" class="col-sm-6 col-lg-4"><article class="card h-100">
<img th:if="${p.imagen != null}" th:src="${p.imagen}" th:alt="${p.nombre}" class="card-img-top" style="height:220px;object-fit:contain">
<div class="card-body"><p class="text-muted" th:text="${p.marca}"></p><h2 class="h5" th:text="${p.nombre}"></h2><p class="fw-bold" th:text="|S/ ${p.precio}|"></p><a class="btn btn-dark" th:href="@{/catalogo/{id}(id=${p.idProducto})}">Ver tallas y colores</a></div></article></div></div>
<div class="d-flex gap-2"><a th:if="${page.hasPrevious()}" class="btn btn-outline-dark" th:href="@{/catalogo(pagina=${page.number - 1},buscar=${buscar})}">Anterior</a><a th:if="${page.hasNext()}" class="btn btn-outline-dark" th:href="@{/catalogo(pagina=${page.number + 1},buscar=${buscar})}">Siguiente</a></div>
</div></body></html>
