<!DOCTYPE html>
<html lang="es" th:replace="~{fragments/general/layout :: layout(~{::content})}">
<body>

<div th:fragment="content">
    <!-- HEADER  -->
    <!-- CONTENIDO  -->
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-5">
            <div class="card border rounded-4 shadow-sm p-4 p-md-5">
              <div class="text-center mb-4">
                <h1 class="fs-2 fw-bold mb-1">Bienvenido de nuevo</h1>
                <p class="text-muted mb-0">
                  Inicia sesión para acceder a tu cuenta.
                </p>
              </div>

              <div th:if="${errorGlobal}" class="alert alert-danger" role="alert"
                   th:text="${errorGlobal}"></div>

              <form th:action="@{/login}" th:object="${loginForm}" method="post" novalidate>
                <div class="mb-3">
                  <label for="correo" class="form-label fw-semibold"
                    >Correo electrónico</label
                  >
                  <input
                    type="email"
                    id="correo"
                    th:field="*{correo}"
                    class="form-control"
                    th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid' : ''"
                    placeholder="ejemplo@gmail.com"
                    required
                  />
                  <div th:if="${#fields.hasErrors('correo')}" class="invalid-feedback d-block"
                    th:errors="*{correo}"></div>
                </div>

                <div class="mb-3">
                  <div
                    class="d-flex justify-content-between align-items-center mb-1"
                  >
                    <label for="clave" class="form-label fw-semibold mb-0"
                      >Contraseña</label
                    >
                    <a
                      href="#"
                      class="small text-muted text-decoration-underline"
                    >
                      ¿Olvidaste tu contraseña?
                    </a>
                  </div>
                  <input
                    type="password"
                    id="clave"
                    th:field="*{clave}"
                    class="form-control"
                    th:classappend="${#fields.hasErrors('clave')} ? 'is-invalid' : ''"
                    placeholder="Ingresa tu contraseña"
                    required
                  />
                  <div th:if="${#fields.hasErrors('clave')}" class="invalid-feedback d-block"
                    th:errors="*{clave}"></div>
                </div>

                <div class="form-check mb-3">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="recordar"
                    th:field="*{recordar}"
                  />
                  <label
                    class="form-check-label"
                    for="recordar"
                    >Recordarme</label
                  >
                </div>

                <button type="submit" class="btn btn-blue w-100 py-2">
                  Iniciar sesión
                </button>
              </form>

              <div class="text-center mt-4">
                <p class="text-muted mb-0">
                  ¿No tienes una cuenta?
                  <a th:href="@{/registro}" class="fw-semibold"
                    >Crear una cuenta</a
                  >
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    <!--FOOTER-->
</div>

</body>
</html>
