<!DOCTYPE html>
<html lang="es" th:replace="~{fragments/general/layout :: layout(~{::content})}">
<body>

<div th:fragment="content">
    <!-- ============ HEADER ============ -->
    <!-- ============ CONTENIDO ============ -->
        <div class="container">
            <div class="border-bottom pb-3 mb-4">
                <div>
                    <h1 class="fs-2 fw-bold mb-1">Mi cuenta</h1>
                    <p class="text-muted mb-0">Administra tu información personal y tus pedidos.</p>
                </div>
            </div>

            <div class="row g-4">
                <!-- MENÚ LATERAL -->
                <aside class="col-md-3">
                    <nav class="nav flex-column gap-1">
                        <a th:href="@{/perfil}" class="nav-link fw-semibold active bg-light border-start border-2 border-dark">
                            <i class="bi bi-person me-2"></i>Perfil
                        </a>
                        <a th:href="@{/pedidos}" class="nav-link text-muted">
                            <i class="bi bi-box-seam me-2"></i>Historial de pedidos
                        </a>
                        <a th:href="@{/login}" class="nav-link text-muted mt-3">
                            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                        </a>
                    </nav>
                </aside>

                <section class="col-md-9">
                    <div class="card border-0 shadow-sm p-4">
                        <h2 class="h5 fw-bold mb-4">Detalles personales</h2>
                        <form>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold" for="firstName">Nombre</label>
                                    <input type="text" class="form-control" id="firstName" th:value="${perfil.nombre}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold" for="lastName">Apellido</label>
                                    <input type="text" class="form-control" id="lastName" th:value="${perfil.apellido}">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold" for="email">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" th:value="${perfil.correo}">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold" for="phone">Teléfono</label>
                                <input type="tel" class="form-control" id="phone" th:value="${perfil.telefono}">
                            </div>
                            <div class="d-flex justify-content-end border-top pt-3">
                                <button type="button" class="btn btn-blue px-4">Guardar cambios</button>
                            </div>
                        </form>
                    </div>

                    <h3 class="h5 fw-bold mt-5 mb-3">Pedidos recientes</h3>
                    <div class="row g-3">
                        <div class="col-md-6" th:each="pedido : ${pedidosRecientes}">
                            <div class="card border-0 shadow-sm h-100 p-3 card-hover">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <div>
                                        <span class="small text-muted text-uppercase"
                                            th:text="|Pedido ${pedido.codigo}|"></span>
                                        <h4 class="h6 fw-bold mt-1 mb-0" th:text="${pedido.nombre}"></h4>
                                    </div>
                                    <span th:class="|badge ${pedido.claseEstado}|" th:text="${pedido.estado}"></span>
                                </div>
                                <div class="d-flex align-items-center gap-3 border-top pt-3">
                                    <img th:src="@{'/img/productos/' + ${pedido.imagen}}" alt="Producto" width="64" height="64"
                                        class="rounded-3 object-fit-cover">
                                    <div>
                                        <p class="fw-bold mb-1" th:text="|S/ ${pedido.total}|"></p>
                                        <a th:href="${pedido.accion}" class="small" th:text="${pedido.textoAccion}"></a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    <!-- ============ FOOTER ============ -->
</div>

</body>
</html>
