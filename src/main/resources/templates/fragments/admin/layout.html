<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/admin/head :: head(${title})}"></head>
<body>
    <div th:replace="~{fragments/admin/sidebar :: sidebar(${currentPage})}"></div>

    <div class="admin-main">
        <div th:replace="~{fragments/admin/topbar :: topbar(${userName})}"></div>

        <main class="admin-content">
            <div class="admin-content-inner d-flex flex-column gap-4">
                <div th:fragment="content"></div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/admin/footer :: footer}"></div>
    <div th:replace="~{fragments/admin/scripts :: scripts}"></div>
</body>
</html>
