<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:fragment="layout(content)">
<head th:replace="~{fragments/admin/head :: head(${title})}"></head>
<body>
    <div th:replace="~{fragments/admin/sidebar :: sidebar(${currentPage})}"></div>

    <div class="admin-main">
        <div th:replace="~{fragments/admin/topbar :: topbar}"></div>

        <main class="admin-content">
            <div th:replace="${content}"></div>
        </main>
    </div>

    <div th:replace="~{fragments/admin/footer :: footer}"></div>
    <div th:replace="~{fragments/admin/scripts :: scripts}"></div>
</body>
</html>
