<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="admin-sidebar" th:fragment="sidebar(activePage)">
    <div class="sidebar-brand">
        <div class="sidebar-avatar">
            <img th:src="@{/icons/KALZA icon 1.png}" alt="Admin" />
        </div>
        <div>
            <h1>KALZA Admin</h1>
            <p>Panel de gestión</p>
        </div>
    </div>

    <ul class="sidebar-nav list-unstyled mb-0">
        <li>
            <a th:href="@{/admin/metricas}" th:classappend="${activePage == 'metricas'} ? 'active'"
              ><i class="bi bi-speedometer2"></i>Panel general</a
            >
        </li>
        <li>
            <a th:href="@{/admin/productos}" th:classappend="${activePage == 'productos'} ? 'active'"
              ><i class="bi bi-box-seam"></i>Productos</a
            >
        </li>
        <li>
            <a th:href="@{/admin/categorias}" th:classappend="${activePage == 'categorias'} ? 'active'"
              ><i class="bi bi-tags"></i>Categorías</a
            >
        </li>
        <li>
            <a th:href="@{/admin/pedidos}" th:classappend="${activePage == 'pedidos'} ? 'active'"
              ><i class="bi bi-bag"></i>Pedidos</a
            >
        </li>
        <li>
            <a th:href="@{/admin/usuarios}" th:classappend="${activePage == 'usuarios'} ? 'active'"
              ><i class="bi bi-people"></i>Usuarios</a
            >
        </li>
        <li>
            <a th:href="@{/admin/publicidad}" th:classappend="${activePage == 'publicidad'} ? 'active'"
              ><i class="bi bi-megaphone"></i>Publicidad</a
            >
        </li>
    </ul>

    <div class="sidebar-logout">
        <a th:href="@{/login}"
          ><i class="bi bi-box-arrow-right"></i>Cerrar sesión</a
        >
    </div>
</nav>
</body>
</html>
