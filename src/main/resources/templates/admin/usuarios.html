<!DOCTYPE html>
<html lang="es" th:replace="~{fragments/admin/layout :: layout(~{::content})}">
<body>

<div th:fragment="content">
        <div class="admin-content-inner d-flex flex-column gap-4">

            <!--CABECERA-->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <h2 class="fs-3 fw-bold mb-1">Usuarios</h2>
                    <p class="text-muted mb-0">Gestiona las cuentas de los clientes registrados.</p>
                </div>
                <button class="btn btn-dark text-nowrap" data-bs-toggle="modal" data-bs-target="#addModal">
                    <i class="bi bi-person-plus me-1"></i>Agregar usuario
                </button>
            </div>

            <!--BUSCADOR-->
            <div class="col-lg-4">
                <form method="get" th:action="@{/admin/usuarios}">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="search" name="buscar" th:value="${buscar}" class="form-control"
                            placeholder="Buscar por nombre o correo...">
                    </div>
                </form>
            </div>

            <!--TABLA DE USUARIOS-->
            <div class="card border-0 shadow-sm overflow-hidden">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th>Correo</th>
                                <th>Fecha de registro</th>
                                <th>Pedidos</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="usuario : ${usuarios}">
                                <td class="fw-semibold">
                                    <div class="d-flex align-items-center gap-3">
                                        <span class="user-avatar"
                                            th:classappend="${usuario.colorClase}"
                                            th:text="${usuario.iniciales}">JD</span>
                                        <span th:text="${usuario.nombre}">Nombre</span>
                                    </div>
                                </td>
                                <td th:text="${usuario.correo}">correo@email.com</td>
                                <td class="text-muted" th:text="${usuario.fechaCorta}">01 ene, 2026</td>
                                <td th:text="${usuario.pedidos}">0</td>
                                <td>
                                    <span th:if="${usuario.estado.name() == 'ACTIVO'}"
                                        class="badge text-bg-success text-uppercase">Activo</span>
                                    <span th:unless="${usuario.estado.name() == 'ACTIVO'}"
                                        class="badge bg-danger text-white text-uppercase">Bloqueado</span>
                                </td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-secondary me-1" title="Editar"
                                        data-bs-toggle="modal" data-bs-target="#editModal">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button th:if="${usuario.estado.name() == 'ACTIVO'}"
                                        class="btn btn-sm btn-outline-secondary" title="Bloquear">
                                        <i class="bi bi-ban"></i>
                                    </button>
                                    <button th:unless="${usuario.estado.name() == 'ACTIVO'}"
                                        class="btn btn-sm btn-outline-primary" title="Desbloquear">
                                        <i class="bi bi-check-circle"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!--PAGINACIÓN-->
                <div class="d-flex justify-content-between align-items-center p-3 border-top small text-muted">
                    <span th:text="|Mostrando ${desde} a ${hasta} de ${#numbers.formatInteger(totalUsuarios, 1, 'COMMA')} usuarios|">Mostrando</span>
                    <div class="btn-group">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:classappend="${paginaActual == 0} ? 'disabled' : ''"
                           th:href="@{/admin/usuarios(pagina=${paginaActual - 1})}">Anterior</a>
                        <a class="btn btn-sm btn-outline-secondary"
                           th:classappend="${paginaActual + 1 >= totalPaginas} ? 'disabled' : ''"
                           th:href="@{/admin/usuarios(pagina=${paginaActual + 1})}">Siguiente</a>
                    </div>
                </div>
            </div>
        </div>
    <!--MODAL AGREGAR USUARIO-->
    <div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title fs-5 fw-bold">Agregar nuevo usuario</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre completo</label>
                        <input type="text" class="form-control" placeholder="Nombre y apellidos">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Correo electrónico</label>
                        <input type="email" class="form-control" placeholder="usuario@email.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Contraseña</label>
                        <input type="password" class="form-control" placeholder="••••••••">
                    </div>
                    <div class="mb-0">
                        <label class="form-label fw-semibold d-block">Rol</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="rol" id="cliente" checked>
                            <label class="form-check-label" for="cliente">Cliente</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="rol" id="admin">
                            <label class="form-check-label" for="admin">Administrador</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-dark">Guardar usuario</button>
                </div>
            </div>
        </div>
    </div>

    <!--MODAL EDITAR USUARIO-->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title fs-5 fw-bold">Editar usuario</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre completo</label>
                        <input type="text" class="form-control" id="editUserNombre" placeholder="Nombre y apellidos">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Correo electrónico</label>
                        <input type="email" class="form-control" id="editUserMail" placeholder="usuario@email.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold d-block">Rol</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="editRol" id="editCliente" checked>
                            <label class="form-check-label" for="editCliente">Cliente</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="editRol" id="editAdmin">
                            <label class="form-check-label" for="editAdmin">Administrador</label>
                        </div>
                    </div>
                    <div class="mb-0">
                        <label class="form-label fw-semibold d-block">Estado</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="editEstado" id="editUserActivo" checked>
                            <label class="form-check-label" for="editUserActivo">Activo</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="editEstado" id="editUserBloqueado">
                            <label class="form-check-label" for="editUserBloqueado">Bloqueado</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-dark">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
