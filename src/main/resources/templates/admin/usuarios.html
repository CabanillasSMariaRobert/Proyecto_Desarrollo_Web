<!DOCTYPE html>
<html lang="es" th:replace="~{fragments/admin/layout :: layout(~{::content})}">
<body>

<div th:fragment="content">
    <div class="admin-content-inner d-flex flex-column gap-4">

        <!--CABECERA-->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div>
                <h2 class="fs-3 fw-bold mb-1">Usuarios</h2>
                <p class="text-muted mb-0">Gestiona las cuentas de los clientes registrados.</p>
            </div>
            <button class="btn btn-dark text-nowrap" data-bs-toggle="modal" data-bs-target="#addModal">
                <i class="bi bi-person-plus me-1"></i>Agregar usuario
            </button>
        </div>

        <!--MENSAJES DE ALERTA-->
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show mb-0" role="alert">
            <span th:text="${mensaje}">Operación correcta</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-0" role="alert">
            <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <!--BUSCADOR-->
        <div class="col-lg-4">
            <form method="get" th:action="@{/admin/usuarios}">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                    <input type="search" name="buscar" th:value="${buscar}" class="form-control"
                           placeholder="Buscar por nombre o correo...">
                </div>
            </form>
        </div>

        <!--TABLA DE USUARIOS-->
        <div class="card border-0 shadow-sm overflow-hidden">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Correo</th>
                        <th>Fecha de registro</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td class="fw-semibold">
                            <div class="d-flex align-items-center gap-3">
                                <span class="user-avatar bg-dark text-white"
                                      th:text="${usuario.nombres != null && !usuario.nombres.isEmpty() ? #strings.substring(usuario.nombres, 0, 1) : 'U'}">U</span>
                                <span th:text="${usuario.nombres + ' ' + (usuario.apellidos != null ? usuario.apellidos : '')}">Nombre</span>
                            </div>
                        </td>
                        <td th:text="${usuario.correo}">correo@email.com</td>
                        <td class="text-muted" th:text="${usuario.creadoEl != null ? #temporals.format(usuario.creadoEl, 'dd/MM/yyyy') : '-'}">01/01/2026</td>
                        <td>
                            <span class="badge text-bg-light text-uppercase border" th:text="${usuario.rol}">COMUN</span>
                        </td>
                        <td>
                            <span th:if="${!usuario.estaBaneado}" class="badge text-bg-success text-uppercase">Activo</span>
                            <span th:if="${usuario.estaBaneado}" class="badge bg-danger text-white text-uppercase">Bloqueado</span>
                        </td>
                        <td class="text-end">
                            <button type="button" class="btn btn-sm btn-outline-secondary me-1" title="Editar"
                                    data-bs-toggle="modal" data-bs-target="#editModal"
                                    th:data-id="${usuario.idUsuario}"
                                    th:data-nombres="${usuario.nombres}"
                                    th:data-apellidos="${usuario.apellidos}"
                                    th:data-correo="${usuario.correo}"
                                    th:data-rol="${usuario.rol}">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <form th:action="@{/admin/usuarios/{id}/estado(id=${usuario.idUsuario})}" method="post" class="d-inline">
                                <button th:if="${!usuario.estaBaneado}" type="submit" class="btn btn-sm btn-outline-secondary" title="Bloquear"
                                        onclick="return confirm('¿Deseas bloquear a este usuario?');">
                                    <i class="bi bi-ban"></i>
                                </button>
                                <button th:if="${usuario.estaBaneado}" type="submit" class="btn btn-sm btn-outline-primary" title="Desbloquear">
                                    <i class="bi bi-check-circle"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="6" class="text-center text-muted py-4">No hay usuarios registrados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!--PAGINACIÓN-->
            <div class="d-flex justify-content-between align-items-center p-3 border-top small text-muted">
                <span th:text="|Mostrando ${desde} a ${hasta} de ${#numbers.formatInteger(totalUsuarios, 1, 'COMMA')} usuarios|">Mostrando</span>
                <div class="btn-group">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:classappend="${paginaActual == 0} ? 'disabled' : ''"
                       th:href="@{/admin/usuarios(pagina=${paginaActual - 1}, buscar=${buscar})}">Anterior</a>
                    <a class="btn btn-sm btn-outline-secondary"
                       th:classappend="${paginaActual + 1 >= totalPaginas} ? 'disabled' : ''"
                       th:href="@{/admin/usuarios(pagina=${paginaActual + 1}, buscar=${buscar})}">Siguiente</a>
                </div>
            </div>
        </div>
    </div>

    <!--MODAL AGREGAR USUARIO-->
    <div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title fs-5 fw-bold">Agregar nuevo usuario</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <form th:action="@{/admin/usuarios/crear}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre completo</label>
                            <input type="text" class="form-control" name="nombres" placeholder="Nombre y apellidos" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Correo electrónico</label>
                            <input type="email" class="form-control" name="correo" placeholder="usuario@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <input type="password" class="form-control" name="clave" placeholder="••••••••" required>
                        </div>
                        <div class="mb-0">
                            <label class="form-label fw-semibold d-block">Rol</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="rol" id="cliente" value="COMUN" checked>
                                <label class="form-check-label" for="cliente">Cliente</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="rol" id="admin" value="ADMINISTRADOR">
                                <label class="form-check-label" for="admin">Administrador</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-dark">Guardar usuario</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!--MODAL EDITAR USUARIO-->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title fs-5 fw-bold">Editar usuario</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <form id="editForm" th:action="@{/admin/usuarios}" th:data-base="@{/admin/usuarios}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre completo</label>
                            <input type="text" class="form-control" name="nombres" id="editUserNombre" placeholder="Nombre y apellidos" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Correo electrónico</label>
                            <input type="email" class="form-control" name="correo" id="editUserMail" placeholder="usuario@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nueva contraseña (opcional)</label>
                            <input type="password" class="form-control" name="clave" placeholder="Dejar en blanco para conservar la actual">
                        </div>
                        <div class="mb-0">
                            <label class="form-label fw-semibold d-block">Rol</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="rol" id="editCliente" value="COMUN">
                                <label class="form-check-label" for="editCliente">Cliente</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="rol" id="editAdmin" value="ADMINISTRADOR">
                                <label class="form-check-label" for="editAdmin">Administrador</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-dark">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('editModal').addEventListener('show.bs.modal', function (event) {
            var boton = event.relatedTarget;
            var form = document.getElementById('editForm');
            form.action = form.dataset.base + '/' + boton.dataset.id + '/actualizar';

            var nombreCompleto = ((boton.dataset.nombres || '') + ' ' + (boton.dataset.apellidos || '')).trim();
            document.getElementById('editUserNombre').value = nombreCompleto;
            document.getElementById('editUserMail').value = boton.dataset.correo || '';

            var rol = boton.dataset.rol;
            if (rol === 'ADMINISTRADOR') {
                document.getElementById('editAdmin').checked = true;
            } else {
                document.getElementById('editCliente').checked = true;
            }
        });
    </script>
</div>

</body>
</html>
