<!DOCTYPE html>
<html lang="es" th:replace="~{fragments/admin/layout :: layout(~{::content})}">
<body>

<div th:fragment="content">
        <div class="admin-content-inner d-flex flex-column gap-4">

            <!-- CABECERA -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <h2 class="fs-3 fw-bold mb-1">Publicidad</h2>
                    <p class="text-muted mb-0">Gestiona los banners y campañas del sitio.</p>
                </div>
                <button class="btn btn-dark text-nowrap" data-bs-toggle="modal" data-bs-target="#addModal">
                    <i class="bi bi-plus-lg me-1"></i>Agregar banner
                </button>
            </div>

            <!-- BANNERS DESTACADOS -->
            <div class="row g-4">
                <div class="col-lg-6" th:each="banner : ${banners}">
                    <div class="card border-0 shadow-sm overflow-hidden h-100">
                        <img th:if="${banner.imagen != null}" th:src="@{'/img/banners/' + ${banner.imagen}}"
                            class="w-100" style="height:200px;object-fit:cover;" th:alt="${banner.titulo}">
                        <div th:unless="${banner.imagen != null}"
                            class="d-flex align-items-center justify-content-center text-muted"
                            style="height:200px;background:#eef1f5;">
                            <i class="bi bi-bag" style="font-size:3rem;"></i>
                        </div>
                        <div class="card-body d-flex flex-column gap-2">
                            <div class="d-flex justify-content-between align-items-center">
                                <h3 class="fs-5 fw-bold mb-0" th:text="${banner.titulo}">Titulo</h3>
                                <span th:if="${banner.activo}" class="badge text-bg-success text-uppercase">Activo</span>
                                <span th:unless="${banner.activo}" class="badge bg-light text-muted text-uppercase">Inactivo</span>
                            </div>
                            <p class="text-muted small mb-2" th:text="${banner.descripcion}">Descripcion</p>
                            <div class="d-flex gap-2 mt-auto">
                                <button class="btn btn-sm btn-outline-secondary me-1" title="Editar"
                                    data-bs-toggle="modal" data-bs-target="#editModal">
                                    <i class="bi bi-pencil me-1"></i>Editar
                                </button>
                                <button th:if="${banner.activo}" class="btn btn-sm btn-outline-secondary"
                                    title="Desactivar">
                                    <i class="bi bi-ban me-1"></i>Desactivar
                                </button>
                                <button th:unless="${banner.activo}" class="btn btn-sm btn-outline-primary"
                                    title="Activar">
                                    <i class="bi bi-check-circle me-1"></i>Activar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    <!-- MODAL AGREGAR BANNER -->
    <div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title fs-5 fw-bold">Agregar nuevo banner</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Título del banner</label>
                        <input type="text" class="form-control" placeholder="Ej. Colección Verano">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Imagen</label>
                        <input type="file" class="form-control" accept="image/*">
                        <div class="form-text">Recomendado: 1920 × 650 px.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Enlace</label>
                        <input type="text" class="form-control" placeholder="https://...">
                    </div>
                    <div class="mb-0">
                        <label class="form-label fw-semibold d-block">Estado</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="estado" id="activo" checked>
                            <label class="form-check-label" for="activo">Activo</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="estado" id="inactivo">
                            <label class="form-check-label" for="inactivo">Inactivo</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-dark">Guardar banner</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL EDITAR BANNER -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title fs-5 fw-bold">Editar banner</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Título del banner</label>
                        <input type="text" class="form-control" id="editTitle" placeholder="Ej. Colección Verano">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Imagen</label>
                        <input type="file" class="form-control" accept="image/*">
                        <div class="form-text">Recomendado: 1920 × 650 px.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Enlace</label>
                        <input type="text" class="form-control" placeholder="https://...">
                    </div>
                    <div class="mb-0">
                        <label class="form-label fw-semibold d-block">Estado</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="editEstado" id="editActivo" checked>
                            <label class="form-check-label" for="editActivo">Activo</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="editEstado" id="editInactivo">
                            <label class="form-check-label" for="editInactivo">Inactivo</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-dark">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Precarga el modal de edición con los datos del banner -->
    <script th:inline="javascript">
        document.querySelectorAll('[data-bs-target="#editModal"]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var card = btn.closest('.card');
                document.getElementById('editTitle').value = card.querySelector('.fs-5').textContent.trim();
                var activo = card.querySelector('.badge').textContent.trim() === 'Activo';
                document.getElementById('editActivo').checked = activo;
                document.getElementById('editInactivo').checked = !activo;
            });
        });
    </script>
</div>

</body>
</html>
